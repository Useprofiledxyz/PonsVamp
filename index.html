<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pons Vamp</title>
    <meta name="description" content="Paste a CA, press Enter, vamp it on Pons. Live Robinhood Chain launchpad feed, quick buy/sell and creator fees." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    </div>
    <header class="top">
      <a href="/" class="brand"><img src="/logo.svg" alt="" class="logo" /><span>PONS<b>VAMP</b></span></a>
      <nav id="nav">
        <a href="/" data-route="">Discover</a>
        <a href="/vamp" data-route="vamp">🧛 Vamp</a>
        <a href="/profile" data-route="profile">Profile</a>
      </nav>
      <div class="quick">
        <input id="quickCA" placeholder="Paste CA → Enter to vamp" autocomplete="off" spellcheck="false" />
      </div>
      <div class="wallet">
        <span id="ethPrice" class="pill muted"></span>
        <button id="connectBtn" class="btn">Connect</button>
        <button id="settingsBtn" class="btn icon" title="Settings">⚙</button>
      </div>
    </header>

    <div id="ticker" class="ticker"><div class="track" id="tickerTrack"></div></div>

    <main id="app"></main>

    <footer class="foot">
      <span class="foot-brand"><img src="/logo.svg" alt="" width="18" height="18" /> <b>Pons Vamp</b> © 2026</span>
      <span class="foot-tag">$VAMP CA: <a href="#" data-copy="0x02c3af333295d0d8627e71de8a17b63803a50d34" class="mono">0x02c3af333295d0d8627e71de8a17b63803a50d34</a> · Paste. Enter. Vamp.</span>
    </footer>

    <div id="toasts"></div>

    <dialog id="settings">
      <form method="dialog">
        <h3>Settings</h3>
        <label>Wallet
          <select id="optWallet">
            <option value="injected">Browser wallet (MetaMask / Rabby)</option>
            <option value="burner">Burner key (no popups, fastest)</option>
          </select>
        </label>
        <label id="burnerRow">Burner private key
          <input id="optBurner" type="password" placeholder="0x…" autocomplete="off" />
          <small class="warn">Stored in this browser's localStorage. Only use a hot wallet with small funds.</small>
        </label>
        <div class="grid2">
          <label>Quick buy (ETH) <input id="optQuickBuy" type="number" min="0" step="0.001" /></label>
          <label>Slippage (%) <input id="optSlippage" type="number" min="0.1" max="50" step="0.1" /></label>
        </div>
        <h4>Vamp</h4>
        <div class="grid2">
          <label>Dev buy (ETH, 0 = none) <input id="optDevBuy" type="number" min="0" step="0.001" /></label>
          <label>Creator tax (bps, 0–<span id="maxTax">1000</span>) <input id="optTax" type="number" min="0" step="1" /></label>
        </div>
        <label class="inline"><input type="checkbox" id="optBuyback" /> Buyback enabled</label>
        <label class="inline"><input type="checkbox" id="optCopySocials" /> Copy socials from source</label>
        <label class="inline"><input type="checkbox" id="optCopyDesc" /> Copy description from source</label>
        <label>Ticker prefix / suffix
          <span class="grid2"><input id="optPrefix" placeholder="prefix" /><input id="optSuffix" placeholder="suffix" /></span>
        </label>
        <label>RPC URL <input id="optRpc" /></label>
        <menu><button value="cancel" class="btn">Cancel</button><button value="save" class="btn primary">Save</button></menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
