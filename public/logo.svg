<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pons Vamp">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8f4"/>
      <stop offset=".35" stop-color="#c9d4cc"/>
      <stop offset=".55" stop-color="#8e9f95"/>
      <stop offset=".8" stop-color="#d7e0da"/>
      <stop offset="1" stop-color="#7d8c83"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="fang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4cc"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5c"/>
      <stop offset="1" stop-color="#b3261e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#335bf9" stop-opacity=".35"/>
      <stop offset="1" stop-color="#335bf9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0a0a0a"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- fangs (behind the P so they hang out of the bowl) -->
  <path d="M63 76 L70 101 L77 76 Z" fill="url(#fang)"/>
  <path d="M83 74 L89 94 L95 70 Z" fill="url(#fang)"/>
  <!-- chunky chrome P with a small counter -->
  <path fill="url(#chrome)" fill-rule="evenodd" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round"
    d="M44 18 H78 A26 26 0 0 1 104 44 V56 A24 24 0 0 1 80 80 H62 V96 A14 14 0 0 1 48 110 H44 A14 14 0 0 1 30 96 V32 A14 14 0 0 1 44 18 Z
       M62 40 H76 A6 6 0 0 1 82 46 V52 A6 6 0 0 1 76 58 H62 Z"/>
  <!-- glossy highlight -->
  <path d="M40 26 H76 A18 18 0 0 1 92 34" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  <!-- blood drop -->
  <path d="M70 104 c0 0 -5 6.5 -5 9.6 a5 5 0 0 0 10 0 c0 -3.1 -5 -9.6 -5 -9.6z" fill="url(#blood)"/>
</svg>
